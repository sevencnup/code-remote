plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sevencnup.codexremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sevencnup.codexremote'
        minSdk 26
        targetSdk 35
        versionCode 98
        versionName '0.2.0-dev.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "codex-remote-android-${variant.versionName}-${variant.buildType.name}.apk"
    }
}
